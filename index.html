    <style>
      html,
      body,
      #app {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #07111c;
      }

      .prelaunch {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        padding:
          calc(20px + env(safe-area-inset-top))
          max(18px, env(safe-area-inset-right))
          calc(20px + env(safe-area-inset-bottom))
          max(18px, env(safe-area-inset-left));
        box-sizing: border-box;
        color: #f8fbff;
        background:
          radial-gradient(circle at 18% 16%, rgba(53, 182, 255, 0.3), transparent 30%),
          radial-gradient(circle at 84% 22%, rgba(239, 68, 68, 0.25), transparent 28%),
          linear-gradient(150deg, #07111c 0%, #111b2a 54%, #08101a 100%);
      }

      .prelaunch::before,
      .prelaunch::after {
        content: '';
        position: absolute;
        z-index: 0;
        border-radius: 999px;
        pointer-events: none;
      }

      .prelaunch::before {
        width: min(420px, 76vw);
        height: min(420px, 76vw);
        top: 7%;
        left: -18%;
        background: conic-gradient(from 180deg, rgba(66, 217, 255, 0.22), rgba(255, 255, 255, 0.15), rgba(239, 68, 68, 0.16), rgba(66, 217, 255, 0.22));
        opacity: 0.85;
      }

      .prelaunch::after {
        width: min(500px, 82vw);
        height: min(500px, 82vw);
        right: -26%;
        bottom: -12%;
        border: 1px solid rgba(66, 217, 255, 0.18);
        background: linear-gradient(135deg, rgba(20, 93, 171, 0.35), rgba(236, 69, 62, 0.24));
      }

      .prelaunch-card {
        position: relative;
        z-index: 1;
        width: min(520px, 100%);
        padding: clamp(26px, 7vw, 44px);
        box-sizing: border-box;
        text-align: center;
        border: 1px solid rgba(226, 233, 244, 0.16);
        border-radius: 34px;
        background:
          radial-gradient(circle at 20% 0%, rgba(66, 217, 255, 0.12), transparent 32%),
          linear-gradient(155deg, rgba(15, 25, 40, 0.95), rgba(9, 16, 26, 0.98));
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.35);
        animation: prelaunch-card-in 480ms ease both;
      }

      .prelaunch-flag {
        position: relative;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        width: 116px;
        height: 82px;
        margin: 0 auto 28px;
        overflow: hidden;
        border-radius: 24px;
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.28);
      }

      .prelaunch-flag b {
        position: absolute;
        inset: auto 26px 22px;
        display: grid;
        min-height: 32px;
        place-items: center;
        border-radius: 999px;
        color: #ffffff;
        background: rgba(7, 17, 28, 0.76);
        font: 800 18px/1 Arial, sans-serif;
        letter-spacing: 0.08em;
      }

      .prelaunch-blue {
        background: #2455b7;
      }

      .prelaunch-white {
        background: #fff8eb;
      }

      .prelaunch-red {
        background: #ef5148;
      }

      .prelaunch-republic {
        margin: 0 0 22px;
        color: #42d9ff;
        font: 900 13px/1.4 Arial, sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .prelaunch-kicker {
        margin: 0 0 10px;
        color: rgba(226, 233, 244, 0.7);
        font: 900 13px/1.4 Arial, sans-serif;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .prelaunch h1 {
        margin: 0;
        font: 700 clamp(48px, 15vw, 70px)/0.92 Georgia, serif;
        letter-spacing: -0.05em;
      }

      .prelaunch-copy {
        max-width: 380px;
        margin: 28px auto 32px;
        color: rgba(226, 233, 244, 0.76);
        font: 500 18px/1.45 Arial, sans-serif;
      }

      .prelaunch-loader {
        height: 9px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
      }

      .prelaunch-loader span {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: inherit;
        transform-origin: left;
        background: linear-gradient(90deg, #42d9ff, #89b9ff, #ffffff);
        animation: prelaunch-load 3s ease-in-out both;
      }

      @keyframes prelaunch-card-in {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      @keyframes prelaunch-load {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
    </style>
